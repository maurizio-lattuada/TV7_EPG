name: Diagnose Init7 API access

# One-off, manual check: shows what the Init7 servers answer to a GitHub-hosted
# runner (which is outside Init7 / Switzerland). Safe to delete once no longer needed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      UA: "tv7-epg/diagnostics (+https://github.com/${{ github.repository }})"
    steps:
      - name: Runner public IP and location
        run: curl -sS --max-time 20 https://ipinfo.io/json || true

      - name: EPG API (expected to fail with 403)
        run: |
          curl -sS --max-time 30 -A "$UA" -D headers.txt -o body.txt -w 'HTTP %{http_code} from %{remote_ip}\n' \
            "https://api.tv.init7.net/api/epg/?channel__canonical_name=SRF1.ch&limit=1" || true
          echo "----- response headers -----"; cat headers.txt || true
          echo "----- response body (first 2000 bytes) -----"; head -c 2000 body.txt || true; echo

      - name: Channel playlist (expected to work)
        run: |
          curl -sS --max-time 30 -A "$UA" -o playlist.m3u -w 'HTTP %{http_code} from %{remote_ip}, %{size_download} bytes\n' \
            https://api.init7.net/tvchannels.m3u || true
          head -3 playlist.m3u || true
